<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 95" fill="none" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Alex+Brush&amp;family=Inter:wght@400;500;600&amp;display=swap');
      .ayra-script {
        font-family: 'Alex Brush', cursive, serif;
      }
      .ayra-sub {
        font-family: 'Inter', -apple-system, sans-serif;
      }
    </style>
    <linearGradient id="ayraGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#B26E6C" />
    </linearGradient>
    <linearGradient id="ayraRoseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2BEBC" />
      <stop offset="50%" stop-color="#C88A88" />
      <stop offset="100%" stop-color="#9C5553" />
    </linearGradient>
    <linearGradient id="basketWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D8AF84" />
      <stop offset="100%" stop-color="#A67446" />
    </linearGradient>
  </defs>

  <!-- ================= HAMPER / GIFT BRAND MARK (LEFT) ================= -->
  <g id="hamper-mark" transform="translate(6, 4)">
    <!-- Basket Arch Handle -->
    <path d="M18 42 C18 16, 62 16, 62 42" stroke="#8C5E32" stroke-width="2.4" stroke-linecap="round" fill="none" />
    <path d="M21 42 C21 20, 59 20, 59 42" stroke="#D2A679" stroke-width="1.2" stroke-linecap="round" fill="none" />

    <!-- Pastel Gift Boxes in Hamper -->
    <!-- Gift Box 1 (Left Tilt) -->
    <rect x="22" y="26" width="18" height="18" rx="1.2" fill="#FFFDF9" stroke="#D8B5B3" stroke-width="0.9" transform="rotate(-7 22 26)" />
    <!-- Gift Box 2 (Center) -->
    <rect x="29" y="20" width="22" height="22" rx="1.5" fill="#FAF0ED" stroke="#D8B5B3" stroke-width="1" />
    <path d="M40 20 L40 42" stroke="#C88A88" stroke-width="1.6" />
    <path d="M29 31 L51 31" stroke="#C88A88" stroke-width="1.6" />
    <!-- Gift Box 3 (Right Tilt) -->
    <rect x="42" y="24" width="18" height="19" rx="1.2" fill="#FDF4F2" stroke="#D8B5B3" stroke-width="0.9" transform="rotate(9 42 24)" />

    <!-- Delicate Bouquet Flowers & Leaves -->
    <circle cx="23" cy="22" r="5" fill="#FCEBE9" stroke="#C88A88" stroke-width="0.8" />
    <circle cx="23" cy="22" r="1.8" fill="#B26E6C" />
    <circle cx="58" cy="24" r="5" fill="#FCEBE9" stroke="#C88A88" stroke-width="0.8" />
    <circle cx="58" cy="24" r="1.8" fill="#B26E6C" />
    <circle cx="40" cy="14" r="5.5" fill="#FAD9D7" stroke="#C88A88" stroke-width="0.8" />
    <circle cx="40" cy="14" r="2" fill="#9C5553" />

    <!-- Delicate Foliage Leaves -->
    <path d="M15 18 C12 13, 10 20, 17 22" fill="#9BAE93" opacity="0.85" />
    <path d="M64 20 C68 15, 70 22, 63 24" fill="#9BAE93" opacity="0.85" />
    <path d="M38 8 C36 3, 44 3, 42 8" fill="#9BAE93" opacity="0.85" />

    <!-- Woven Hamper Basket Body -->
    <path d="M13 42 L20 74 C21 78, 59 78, 60 74 L67 42 Z" fill="url(#basketWood)" stroke="#6D431D" stroke-width="1.4" />
    <path d="M11 41 C11 39, 69 39, 69 41 L67 44 C67 45, 13 45, 13 44 Z" fill="#C49360" stroke="#6D431D" stroke-width="1.1" />

    <!-- Basket Weave Horizontal Bands -->
    <path d="M16 51 C30 54, 50 54, 64 51" stroke="#6D431D" stroke-width="0.9" fill="none" opacity="0.5" />
    <path d="M18 60 C30 63, 50 63, 62 60" stroke="#6D431D" stroke-width="0.9" fill="none" opacity="0.5" />
    <path d="M20 69 C30 72, 50 72, 60 69" stroke="#6D431D" stroke-width="0.9" fill="none" opacity="0.5" />
    
    <!-- Basket Vertical Strands -->
    <path d="M28 44 L29 75" stroke="#6D431D" stroke-width="0.75" opacity="0.45" />
    <path d="M40 44 L40 76" stroke="#6D431D" stroke-width="0.75" opacity="0.45" />
    <path d="M52 44 L51 75" stroke="#6D431D" stroke-width="0.75" opacity="0.45" />

    <!-- Center Satin Ribbon Bow & Flowing Ends -->
    <ellipse cx="40" cy="46" rx="3.8" ry="3.2" fill="#9C5553" />
    <path d="M40 46 C33 37, 23 39, 26 48 C29 53, 38 49, 40 46 Z" fill="#ECA9A7" stroke="#B26E6C" stroke-width="0.9" />
    <path d="M40 46 C47 37, 57 39, 54 48 C51 53, 42 49, 40 46 Z" fill="#ECA9A7" stroke="#B26E6C" stroke-width="0.9" />
    <path d="M38 48 C35 56, 29 68, 24 76 C27 75, 36 64, 39 50 Z" fill="#DE9492" />
    <path d="M42 48 C45 56, 51 68, 56 76 C53 75, 44 64, 41 50 Z" fill="#DE9492" />

    <!-- Tiny Floating Butterflies -->
    <path d="M5 18 C2 13, 0 19, 5 21 C7 22, 8 16, 5 18 Z" fill="#E5A9A7" opacity="0.9" />
    <path d="M72 16 C75 11, 77 17, 72 19 C70 20, 69 14, 72 16 Z" fill="#E5A9A7" opacity="0.9" />
  </g>

  <!-- ================= TYPOGRAPHY: AYRA HAMPERS (RIGHT) ================= -->
  <g id="brand-text" transform="translate(94, 6)">
    <!-- "Ayra" Master Script Calligraphy -->
    <text x="0" y="47" class="ayra-script" font-family="'Alex Brush', 'Playfair Display', cursive, serif" font-size="52" font-style="italic" fill="#221A1A" letter-spacing="0.5">
      Ayra
    </text>

    <!-- "H A M P E R S" Spaced Luxury Subtitle -->
    <text x="3" y="68" class="ayra-sub" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="500" fill="#6E5555" letter-spacing="0.46em">
      HAMPERS
    </text>

    <!-- Signature Heart Line Divider -->
    <line x1="3" y1="79" x2="68" y2="79" stroke="#E8B7B5" stroke-width="0.85" />
    <path d="M74 77.5 C74 75.5, 71.5 74.5, 70 76 C68.5 74.5, 66 75.5, 66 77.5 C66 80, 70 82.5, 70 82.5 C70 82.5, 74 80, 74 77.5 Z" fill="#B97878" transform="translate(4, -1)" />
    <line x1="82" y1="79" x2="148" y2="79" stroke="#E8B7B5" stroke-width="0.85" />
  </g>
</svg>
